<!DOCTYPE html>
<html>
<body>

<p id="demo"></p>

<script>
var xhttp = new XMLHttpRequest();

xhttp.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
        myFunction(this);
    }
};

xhttp.open("GET", "menu.xml", true);
xhttp.send();

function myFunction(xml) {
    var xmlDoc = xml.responseXML;
    var x;
    var txt = "";

    x = xmlDoc.getElementsByTagName("menu")[0].childNodes[1];

    txt += x.getAttribute("id") + "<br>";

    // Lấy node đầu tiên bên trong mon
    x = xmlDoc.getElementsByTagName("mon")[0].childNodes[1];

    txt += x.nodeName + ": " + x.childNodes[0].nodeValue + "<br>";

    document.getElementById("demo").innerHTML = txt;
}
</script>

</body>
</html>
