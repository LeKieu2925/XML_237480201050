<!DOCTYPE html>
<html lang="vi">
<body>
    <h2>Tổng lương của tất cả nhân viên:</h2>
    <div id="demo"></div>

    <script>
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (xhttp.readyState == 4 && xhttp.status == 200) {
                tinhTongLuong(xhttp);
            }
        };
        xhttp.open("GET", "danhsachnhanvien.xml", true);
        xhttp.send();
        
        function tinhTongLuong(xml) {
            var xmlDoc = xml.responseXML;
            // tất cả các thẻ lương
            var luongList = xmlDoc.getElementsByTagName("luong");
            var tongLuong = 0;
            // Duyệt qua từng thẻ lương để cộng dồn
            for (var i = 0; i < luongList.length; i++) {
                var giaTriLuong = parseInt(luongList[i].childNodes[0].nodeValue.trim());
                tongLuong += giaTriLuong;
            }
            document.getElementById("demo").innerHTML = "<b>" + tongLuong.toLocaleString('vi-VN') + " VNĐ</b>";
        }
    </script>
</body>
</html>
