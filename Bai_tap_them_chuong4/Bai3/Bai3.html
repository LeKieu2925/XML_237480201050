<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 3</title>
</head>
<body>
    <h2>Truy xuất nút con đầu tiên và cuối cùng</h2>
    <p id="first"></p>
    <p id="last"></p>
    <script>
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                // Lay nut book
                var book = this.responseXML.getElementsByTagName("book")[0];
                // Lay nut con dau tien
                var first = book.firstElementChild;
                // Lay nut con cuoi cung
                var last = book.lastElementChild;
                // Hien thi gia tri
                document.getElementById("first").innerHTML =
                    "Nút con đầu tiên: " + first.textContent;
                document.getElementById("last").innerHTML =
                    "Nút con cuối cùng: " + last.textContent;
            }
        };
        // Tai file XML
        xhttp.open("GET", "book3.xml", true);
        // Gui yeu cau
        xhttp.send();
    </script>
</body>
</html>
