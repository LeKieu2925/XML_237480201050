<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách môn học</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #ddd;
        }
        h2 {
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Danh sách môn học</h2>
    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Tên môn học</th>
                <th>Nhà xuất bản</th>
                <th>Tác giả</th>
            </tr>
        </thead>
        <tbody id="dsMonHoc">
        </tbody>
    </table>
    <script>
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "dsmonhoc.xml", true);
        xhr.onload = function() {
            if (xhr.status == 200) {
                // Chuyen doi noi dung XML thanh cay DOM
                var xml = xhr.responseXML;
                // Lay tat ca cac the subject
                var subjects = xml.getElementsByTagName("subject");
                // Lay vi tri bang
                var table = document.getElementById("dsMonHoc");
                // Duyet tung mon hoc
                for (var i = 0; i < subjects.length; i++) {
                    var title = subjects[i].getElementsByTagName("title")[0].textContent.trim();
                    var publisher = subjects[i].getElementsByTagName("publisher")[0].textContent.trim();
                    var author = subjects[i].getElementsByTagName("author")[0].textContent.trim();
                    // Tao mot dong
                    var row = table.insertRow();
                    // Them cac cot
                    row.insertCell(0).textContent = i + 1;
                    row.insertCell(1).textContent = title;
                    row.insertCell(2).textContent = publisher;
                    row.insertCell(3).textContent = author;
                }
            }
        };
        xhr.send();
    </script>
</body>
</html>
